name: Inspect Moodle migration without changing server files
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_USER: ${{ secrets.BLUEHOST_FTP_USERNAME }}
      FTP_PASS: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
    steps:
      - name: Compare non-secret Moodle configuration and version metadata
        run: |
          cat > "$RUNNER_TEMP/moodle-compare.cjs" <<'JS'
          const crypto=require('crypto'),{spawnSync}=require('child_process');
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          function get(ip,file,list=false){
           const args=['--fail','--silent','--show-error','--connect-timeout','10','--max-time','35','--ssl-reqd','--resolve',`ftp.bluehost.com:21:${ip}`,'--user',process.env.FTP_USER+':'+process.env.FTP_PASS];
           if(list)args.push('--list-only');
           args.push('ftp://ftp.bluehost.com/'+file);
           const r=spawnSync('curl',args,{maxBuffer:2097152});
           if(r.status!==0)throw new Error(`Secure read failed (curl exit ${r.status})`);
           return r.stdout;
          }
          function literal(text,name){
           const re=new RegExp('^\\s*\\$CFG->'+name+'\\s*=\\s*([\'\"])([^\'\"\\r\\n]*)\\1\\s*;','m');
           const m=text.match(re);return m?m[2]:null;
          }
          const summaries=[];
          for(const [label,ip] of [['new','129.121.157.187'],['old','173.254.30.77']]){
           try{
            const raw=get(ip,'moodle/config.php'),config=raw.toString('utf8');
            const summary={server:label,ip,config_sha256:hash(raw),wwwroot:literal(config,'wwwroot'),database_name:literal(config,'dbname'),table_prefix:literal(config,'prefix'),data_directory:literal(config,'dataroot'),database_type:literal(config,'dbtype')};
            try{const ver=get(ip,'moodle/version.php').toString('utf8');summary.release=ver.match(/^\s*\$release\s*=\s*['"]([^'"]+)/m)?.[1]||null;summary.code_version=ver.match(/^\s*\$version\s*=\s*([0-9.]+)/m)?.[1]||null;}catch(e){summary.version_read=e.message;}
            try{summary.related_root_entries=get(ip,'',true).toString('utf8').split(/\r?\n/).filter(x=>/moodle|lms|backup|softaculous|installatron/i.test(x)).slice(0,30);}catch(e){summary.root_listing=e.message;}
            summaries.push(summary);
           }catch(e){summaries.push({server:label,ip,status:e.message});}
          }
          for(const s of summaries)console.log(JSON.stringify(s));
          console.log('Read-only comparison complete. No files, settings, courses, or accounts were changed.');
          JS
          node "$RUNNER_TEMP/moodle-compare.cjs"
