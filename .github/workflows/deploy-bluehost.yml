name: Set and verify Moodle max_input_vars
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FTP_USER: ${{ secrets.BLUEHOST_FTP_USERNAME }}
      FTP_PASS: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
    steps:
      - name: Set Moodle local INI value to 5000 and verify it
        run: |
          cat > "$RUNNER_TEMP/ini-check.php" <<'PHP'
          <?php
          ini_set('display_errors','0');header('Cache-Control: no-store');
          if(time()>__EXPIRES__||!hash_equals('__HASH__',hash('sha256',$_SERVER['HTTP_X_AGS_DIAG']??''))){http_response_code(404);exit;}
          header('Content-Type: application/json');$home='/home1/agsedug1';$out=['php'=>PHP_VERSION,'loaded_ini'=>php_ini_loaded_file()];
          if(__DIR__===$home.'/public_html'){
           $base=$home.'/public_html/moodle';if(realpath($base)!==$base)throw new RuntimeException('Unexpected Moodle path');$saved=$home.'/.ags-php-setting-'.gmdate('Ymd-His').'-'.bin2hex(random_bytes(6));mkdir($saved,0700);
           foreach(['php.ini','.user.ini'] as $name){$path=$base.'/'.$name;if(is_link($path))throw new RuntimeException('Unexpected configuration symlink');$exists=is_file($path);$before=$exists?file_get_contents($path):'';if($exists){file_put_contents($saved.'/'.$name.'.before',$before);chmod($saved.'/'.$name.'.before',0600);}else file_put_contents($saved.'/'.$name.'.previously-absent','');$after=preg_replace('/^[ \t]*max_input_vars[ \t]*=[^\r\n]*/mi','max_input_vars = 5000',$before,-1,$count);if(!$count)$after=rtrim($before)."\nmax_input_vars = 5000\n";if((parse_ini_string($after,false,INI_SCANNER_RAW)['max_input_vars']??null)!=='5000')throw new RuntimeException('Invalid resulting INI configuration');if($after!==$before){$temp=$path.'.ags-'.bin2hex(random_bytes(6));file_put_contents($temp,$after);chmod($temp,0644);if(($exists&&file_get_contents($path)!==$before)||(!$exists&&file_exists($path))){unlink($temp);throw new RuntimeException('Configuration changed during update');}if(!rename($temp,$path))throw new RuntimeException('Cannot save Moodle configuration');}$out['updated'][$name]=['path'=>$path,'max_input_vars'=>5000];}
           $out['previous_configuration_on_server']=$saved;
          }
          $out['effective_max_input_vars']=(int)ini_get('max_input_vars');echo json_encode($out,JSON_UNESCAPED_SLASHES);
          PHP
          cat > "$RUNNER_TEMP/ini-check.cjs" <<'JS'
          const fs=require('fs'),path=require('path'),crypto=require('crypto'),{spawnSync}=require('child_process');
          function ftp(ip,file,upload,remove=false){const host=ip==='173.254.30.77'?'ftp.justhost.com':'ftp.bluehost.com';const args=['--fail','--silent','--show-error','--connect-timeout','15','--max-time','60','--ssl-reqd','--resolve',`${host}:21:${ip}`,'--user',process.env.FTP_USER+':'+process.env.FTP_PASS];if(upload)args.push('--upload-file','-');if(remove)args.push('--quote','DELE '+file,'--list-only');args.push('ftp://'+host+'/'+(remove?'':file));const r=spawnSync('curl',args,{input:upload,maxBuffer:2097152});if(r.status!==0){const e=new Error('FTPS operation failed with exit '+r.status);e.code=r.status;throw e;}return r.stdout;}
          
          const statePath=path.join(process.env.RUNNER_TEMP,'ini-state.json');
          function cleanup(){if(!fs.existsSync(statePath))return;for(const file of JSON.parse(fs.readFileSync(statePath)).files){try{ftp('129.121.157.187',file);}catch(e){if(e.code===78)continue;throw e;}ftp('129.121.157.187',file,undefined,true);try{ftp('129.121.157.187',file);throw new Error('Probe remains');}catch(e){if(e.code!==78)throw e;}console.log(JSON.stringify({removed:file}));}}
          async function check(){const token=crypto.randomBytes(32).toString('hex'),id=crypto.randomBytes(8).toString('hex'),name='ags-ini-'+id+'.php',state={files:[]};const script=Buffer.from(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'ini-check.php'),'utf8').replaceAll('__EXPIRES__',String(Math.floor(Date.now()/1000)+3600)).replaceAll('__HASH__',crypto.createHash('sha256').update(token).digest('hex')));for(const [file,host] of [[name,'agsedu.org'],['moodle/'+name,'lms.agsedu.org']]){state.files.push(file);fs.writeFileSync(statePath,JSON.stringify(state),{mode:0o600});ftp('129.121.157.187',file,script);const x=spawnSync('curl',['--http1.1','--silent','--show-error','--connect-timeout','10','--max-time','55','--resolve',host+':443:129.121.157.187','--header','X-AGS-Diag: '+token,'https://'+host+'/'+name],{maxBuffer:262144});let result;try{result=JSON.parse(x.stdout.toString());}catch{result={html_title:x.stdout.toString().match(/<title>(.*?)<\/title>/is)?.[1],bytes:x.stdout.length,curl_exit:x.status};}if(host==='lms.agsedu.org'&&result.effective_max_input_vars!==5000){for(let attempt=0;attempt<12&&result.effective_max_input_vars!==5000;attempt++){await new Promise(resolve=>setTimeout(resolve,5000));const retry=spawnSync('curl',['--http1.1','--fail','--silent','--show-error','--max-time','20','--resolve',host+':443:129.121.157.187','--header','X-AGS-Diag: '+token,'https://'+host+'/'+name+'?check='+attempt],{maxBuffer:65536});try{result=JSON.parse(retry.stdout.toString());}catch{result={error:'Configuration probe failed'};}}}console.log(JSON.stringify({host,result}));if(host==='lms.agsedu.org'&&result.effective_max_input_vars!==5000)throw new Error('Moodle max_input_vars is not yet 5000');}
          for(const url of ['https://lms.agsedu.org/','https://lms.agsedu.org/login/index.php']){const dest=path.join(process.env.RUNNER_TEMP,'php-repair-check.html');const x=spawnSync('curl',['--silent','--show-error','--fail','--location','--max-time','30','--output',dest,'--write-out','%{http_code}|%{remote_ip}|%{url_effective}',url]);const body=fs.existsSync(dest)?fs.readFileSync(dest,'utf8'):'';const title=body.match(/<title>(.*?)<\/title>/is)?.[1]||null;const ok=x.status===0&&x.stdout.toString().startsWith('200|')&&(url==='https://agsedu.org/'||/Elizabeth/i.test(title||''));console.log(JSON.stringify({page_check:{url,ok,result:x.stdout.toString(),title}}));if(!ok)throw new Error('Page check failed');}}
          
          (async()=>{try{if(process.argv[2]==='cleanup')cleanup();else await check();}catch(e){console.error(e.message);process.exitCode=1;}})();
          JS
          php -l "$RUNNER_TEMP/ini-check.php"
          node "$RUNNER_TEMP/ini-check.cjs" check
      - name: Remove temporary diagnostics
        if: always()
        run: node "$RUNNER_TEMP/ini-check.cjs" cleanup
