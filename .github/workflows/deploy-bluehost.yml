name: Restore original Elizabeth Moodle on the new server
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_USER: ${{ secrets.BLUEHOST_FTP_USERNAME }}
      FTP_PASS: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
    steps:
      - name: Restore Elizabeth on the server and verify both Moodle addresses
        run: |
          cat > "$RUNNER_TEMP/elizabeth-restore.php" <<'PHP'
          <?php
          ini_set('display_errors','0');set_time_limit(900);header('Cache-Control: no-store');
          if(time()>__EXPIRES__||!hash_equals('__TOKEN_HASH__',hash('sha256',$_SERVER['HTTP_X_AGS_RECOVERY_TOKEN']??''))){http_response_code(404);exit;}
          $home='/home1/agsedug1';$work=$home.'/.ags-elizabeth-__ID__';$role='__ROLE__';$stage='request';
          function answer($v){header('Content-Type: application/json');echo json_encode($v,JSON_THROW_ON_ERROR);exit;}
          function run_cmd($args,$output='/dev/null'){global $work;$p=proc_open($args,[0=>['file','/dev/null','r'],1=>['file',$output,'w'],2=>['file',$work.'/error.log','w']],$pipes);if(!is_resource($p)||proc_close($p)!==0)throw new RuntimeException('Server archive operation failed');}
          function safe_relative($p){if(!is_string($p)||$p===''||str_starts_with($p,'/')||str_contains($p,"\0")||str_contains($p,'\\')||preg_match('#(^|/)\.\.(/|$)#',$p))throw new RuntimeException('Invalid relative path');return $p;}
          function db($p){if(($p['database']??'')!=='agsedug1_moodl'||($p['prefix']??'')!=='mdl_')throw new RuntimeException('Unexpected database');mysqli_report(MYSQLI_REPORT_ERROR|MYSQLI_REPORT_STRICT);$d=new mysqli('localhost',$p['username'],$p['password'],$p['database']);$d->set_charset('utf8mb4');return $d;}
          function summary($p,$data){$d=db($p);$d->query('START TRANSACTION READ ONLY');$v=['site'=>$d->query('SELECT fullname,shortname FROM mdl_course WHERE id=1')->fetch_assoc()];foreach(['courses'=>'SELECT COUNT(*) n FROM mdl_course WHERE id<>1','accounts'=>"SELECT COUNT(*) n FROM mdl_user WHERE deleted=0 AND username<>'guest'",'enrolments'=>'SELECT COUNT(*) n FROM mdl_user_enrolments'] as $k=>$sql)$v[$k]=(int)$d->query($sql)->fetch_assoc()['n'];$rows=$d->query("SELECT DISTINCT contenthash FROM mdl_files WHERE filename<>'.' AND filesize>0");$v['files_checked']=0;$v['files_present']=0;while($r=$rows->fetch_assoc()){$h=$r['contenthash'];if(!preg_match('/^[0-9a-f]{40}$/',$h))continue;$v['files_checked']++;if(is_readable($data.'/filedir/'.substr($h,0,2).'/'.substr($h,2,2).'/'.$h))$v['files_present']++;}$d->rollback();$d->close();return $v;}
          function source($payload,$token,$dest=null){$c=curl_init('https://agsedu.org/ags-elizabeth-__ID__.php');$headers=['Content-Type: application/json','X-AGS-Recovery-Token: '.$token];curl_setopt_array($c,[CURLOPT_RESOLVE=>['agsedu.org:443:173.254.30.77'],CURLOPT_SSL_VERIFYPEER=>true,CURLOPT_SSL_VERIFYHOST=>2,CURLOPT_HTTP_VERSION=>CURL_HTTP_VERSION_1_1,CURLOPT_POST=>true,CURLOPT_POSTFIELDS=>json_encode($payload),CURLOPT_HTTPHEADER=>$headers,CURLOPT_CONNECTTIMEOUT=>15,CURLOPT_TIMEOUT=>180,CURLOPT_FAILONERROR=>true]);$f=null;if($dest!==null){$f=fopen($dest,'wb');curl_setopt($c,CURLOPT_FILE,$f);}else curl_setopt($c,CURLOPT_RETURNTRANSFER,true);$r=curl_exec($c);$error=curl_errno($c);curl_close($c);if($f)fclose($f);if($error)throw new RuntimeException('Direct server file transfer failed: '.$error);if($dest!==null)return;$v=json_decode($r,true,512,JSON_THROW_ON_ERROR);if(!($v['ok']??false))throw new RuntimeException('Source inspection failed');return $v;}
          try{
           umask(0077);if(!is_dir($work))mkdir($work,0700);$p=json_decode(file_get_contents('php://input'),true,32,JSON_THROW_ON_ERROR);$action=$p['action']??'';
           if($role==='old'&&$action==='inventory'){
            $base=$home.'/public_html/moodle';$files=[];$it=new RecursiveIteratorIterator(new RecursiveDirectoryIterator($base,FilesystemIterator::SKIP_DOTS));
            foreach($it as $f){if(!$f->isFile())continue;$rel=substr($f->getPathname(),strlen($base)+1);if(str_starts_with($rel,'.git/')||str_starts_with($rel,'ags-recovery-'))continue;$real=realpath($f->getPathname());if(!str_starts_with($real,$base.'/'))continue;$files[$rel]=['bytes'=>$f->getSize(),'sha256'=>hash_file('sha256',$real)];}ksort($files);answer(['ok'=>true,'files'=>$files]);
           }
           if($role==='old'&&$action==='file'){
            $area=$p['area']??'';if($area==='code'){$base=$home.'/public_html/moodle';$rel=safe_relative($p['path']??'');}
            elseif($area==='data'){$base=$home.'/moodledata';$h=$p['hash']??'';if(!preg_match('/^[0-9a-f]{40}$/',$h))throw new RuntimeException('Invalid file hash');$rel='filedir/'.substr($h,0,2).'/'.substr($h,2,2).'/'.$h;}
            else throw new RuntimeException('Invalid file area');
            $real=realpath($base.'/'.$rel);if(!$real||!str_starts_with($real,$base.'/')||!is_file($real))throw new RuntimeException('Requested application file unavailable');header('Content-Type: application/octet-stream');header('Content-Length: '.filesize($real));readfile($real);exit;
           }
           if($role!=='new')throw new RuntimeException('Action unavailable on source');
           if($action==='stage'){
            $stage='verify_original_database';$before=summary($p['database'],$home.'/moodledata');if($before['site']['shortname']!=='Elizabeth'||$before['courses']<111||$before['accounts']<1175)throw new RuntimeException('Original database verification failed');
            $archive=$home.'/backup-9.26.2026_12-28-30_agsedug1.tar.gz';if(!is_file($archive)||filesize($archive)!==1661467059)throw new RuntimeException('Expected server backup unavailable');
            if(is_dir($work.'/stage'))throw new RuntimeException('Staging directory already exists');
            $stage='inspect_server_backup';run_cmd(['/usr/bin/tar','-tf',$archive],$work.'/archive-entries.txt');$prefix=null;$nested=null;$relevant=[];$f=fopen($work.'/archive-entries.txt','r');while(($line=fgets($f))!==false){$name=rtrim($line,"\r\n");if(preg_match('#(^|/)homedir\.tar(?:\.gz)?$#',$name))$nested=$name;if(preg_match('/homedir|moodle/i',$name)&&count($relevant)<15)$relevant[]=$name;if(str_ends_with($name,'public_html/moodle/config.php'))$prefix=substr($name,0,-strlen('public_html/moodle/config.php'));}fclose($f);
            if($prefix===null&&$nested!==null){$stage='unpack_home_directory';run_cmd(['/usr/bin/tar','-xOf',$archive,$nested],$work.'/homedir.tar');$archive=$work.'/homedir.tar';run_cmd(['/usr/bin/tar','-tf',$archive],$work.'/home-entries.txt');$f=fopen($work.'/home-entries.txt','r');while(($line=fgets($f))!==false){$name=rtrim($line,"\r\n");if(str_ends_with($name,'public_html/moodle/config.php')){$prefix=substr($name,0,-strlen('public_html/moodle/config.php'));break;}}fclose($f);}
            if($prefix===null)throw new RuntimeException('Moodle not found in server backup; archive layout: '.json_encode($relevant));
            $strip=trim($prefix,'/')===''?0:count(explode('/',trim($prefix,'/')));
            $stage='extract_original_files';mkdir($work.'/stage',0700);umask(0022);run_cmd(['/usr/bin/tar','-xf',$archive,'--no-same-owner','--no-same-permissions','--exclude=*/moodledata/cache','--exclude=*/moodledata/localcache','--exclude=*/moodledata/sessions','--exclude=*/moodledata/temp','--exclude=*/moodledata/trashdir','--exclude=*/moodledata/lock','--strip-components='.$strip,'-C',$work.'/stage',$prefix.'public_html/moodle',$prefix.'moodledata']);umask(0077);
            $code=$work.'/stage/public_html/moodle';$data=$work.'/stage/moodledata';if(!is_file($code.'/config.php')||!is_dir($data.'/filedir'))throw new RuntimeException('Extracted Moodle backup is incomplete');
            $stage='match_current_original_code';$inventory=source(['action'=>'inventory'],$p['source_token']);$copied=0;
            foreach($inventory['files'] as $rel=>$info){safe_relative($rel);$dest=$code.'/'.$rel;if(is_file($dest)&&!is_link($dest)&&filesize($dest)===$info['bytes']&&hash_file('sha256',$dest)===$info['sha256'])continue;if(is_link($dest))unlink($dest);if(!is_dir(dirname($dest)))mkdir(dirname($dest),0755,true);$parent=realpath(dirname($dest));if(!str_starts_with($parent,$code.'/')&&$parent!==$code)throw new RuntimeException('Unexpected staging path');source(['action'=>'file','area'=>'code','path'=>$rel],$p['source_token'],$dest);chmod($dest,0644);if(filesize($dest)!==$info['bytes']||hash_file('sha256',$dest)!==$info['sha256'])throw new RuntimeException('Application file integrity check failed');$copied++;}
            $it=new RecursiveIteratorIterator(new RecursiveDirectoryIterator($code,FilesystemIterator::SKIP_DOTS),RecursiveIteratorIterator::CHILD_FIRST);foreach($it as $entry){if(!$entry->isFile()&&!$entry->isLink())continue;$rel=substr($entry->getPathname(),strlen($code)+1);if(!isset($inventory['files'][$rel]))unlink($entry->getPathname());}
            $stage='restore_current_course_files';$d=db($p['database']);$rows=$d->query("SELECT DISTINCT contenthash FROM mdl_files WHERE filename<>'.' AND filesize>0");$filecopied=0;$verified=0;
            while($r=$rows->fetch_assoc()){$h=$r['contenthash'];if(!preg_match('/^[0-9a-f]{40}$/',$h))continue;$dest=$data.'/filedir/'.substr($h,0,2).'/'.substr($h,2,2).'/'.$h;if(!is_file($dest)||sha1_file($dest)!==$h){if(!is_dir(dirname($dest)))mkdir(dirname($dest),0700,true);source(['action'=>'file','area'=>'data','hash'=>$h],$p['source_token'],$dest);chmod($dest,0600);if(sha1_file($dest)!==$h)throw new RuntimeException('Course file integrity check failed');$filecopied++;}$verified++;}$d->close();
            $stage='prepare_runtime';if(!is_executable('/opt/cpanel/ea-php83/root/usr/bin/php'))throw new RuntimeException('Required PHP runtime unavailable');file_put_contents($code.'/.htaccess',"\n# Elizabeth recovery: match the original PHP runtime.\n<IfModule mime_module>\nAddHandler application/x-httpd-ea-php83 .php .php8 .phtml\n</IfModule>\n",FILE_APPEND);chmod($code.'/.htaccess',0644);chmod($code.'/config.php',0640);
            $after=summary($p['database'],$data);if($after['files_present']!==$after['files_checked'])throw new RuntimeException('Staged course files are incomplete');$plan=['before_config_sha256'=>hash_file('sha256',$home.'/public_html/moodle/config.php'),'restored_config_sha256'=>hash_file('sha256',$code.'/config.php'),'database'=>$after,'application_files_copied'=>$copied,'course_files_copied'=>$filecopied,'course_files_verified'=>$verified,'code_files'=>count($inventory['files'])];file_put_contents($work.'/plan.json',json_encode($plan,JSON_PRETTY_PRINT));answer(['ok'=>true,'private_directory'=>$work,'plan'=>$plan]);
           }
           if($action==='apply'){
            $stage='activate_original_installation';$plan=json_decode(file_get_contents($work.'/plan.json'),true,32,JSON_THROW_ON_ERROR);$live=$home.'/public_html/moodle';$data=$home.'/moodledata';$ready=$work.'/stage/public_html/moodle';$readydata=$work.'/stage/moodledata';
            if(realpath($live)!==$live||realpath($data)!==$data||hash_file('sha256',$live.'/config.php')!==$plan['before_config_sha256']||is_dir($work.'/previous-code')||is_dir($work.'/previous-data'))throw new RuntimeException('Live configuration changed or rollback directory already exists');
            $moves=[];try{foreach([[$live,$work.'/previous-code'],[$data,$work.'/previous-data'],[$ready,$live],[$readydata,$data]] as [$from,$to]){if(!rename($from,$to))throw new RuntimeException('Cannot activate staged files');$moves[]=[$from,$to];}}catch(Throwable $e){foreach(array_reverse($moves) as [$from,$to])rename($to,$from);throw $e;}
            file_put_contents($work.'/applied.json',json_encode(['utc'=>gmdate('c'),'plan'=>$plan]));answer(['ok'=>true,'database'=>summary($p['database'],$data),'rollback_directory'=>$work]);
           }
           if($action==='verify'){answer(['ok'=>true,'database'=>summary($p['database'],$home.'/moodledata'),'config_sha256'=>hash_file('sha256',$home.'/public_html/moodle/config.php')]);}
           if($action==='rollback'){
            $stage='rollback';$plan=json_decode(file_get_contents($work.'/plan.json'),true,32,JSON_THROW_ON_ERROR);$live=$home.'/public_html/moodle';$data=$home.'/moodledata';if(hash_file('sha256',$live.'/config.php')!==$plan['restored_config_sha256']||!is_dir($work.'/previous-code')||!is_dir($work.'/previous-data'))throw new RuntimeException('Rollback preconditions failed');foreach([[$live,$work.'/restored-code-held'],[$data,$work.'/restored-data-held'],[$work.'/previous-code',$live],[$work.'/previous-data',$data]] as [$a,$b])if(!rename($a,$b))throw new RuntimeException('Rollback move failed');answer(['ok'=>true,'rolled_back'=>true]);
           }
           throw new RuntimeException('Unknown recovery action');
          }catch(Throwable $e){answer(['ok'=>false,'stage'=>$stage,'error_code'=>(int)$e->getCode(),'error'=>$e instanceof mysqli_sql_exception?'Database read failed':$e->getMessage()]);}
          PHP
          cat > "$RUNNER_TEMP/elizabeth-restore.cjs" <<'JS'
          const fs=require('fs'),path=require('path'),crypto=require('crypto'),{spawnSync}=require('child_process');
          const dir=path.join(process.env.RUNNER_TEMP,'elizabeth-restore');
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          function ftp(ip,file,upload,remove=false){const host=ip==='173.254.30.77'?'ftp.justhost.com':'ftp.bluehost.com';const args=['--fail','--silent','--show-error','--connect-timeout','15','--max-time','60','--ssl-reqd','--resolve',`${host}:21:${ip}`,'--user',process.env.FTP_USER+':'+process.env.FTP_PASS];if(upload)args.push('--upload-file','-');if(remove)args.push('--quote','DELE '+file,'--list-only');args.push('ftp://'+host+'/'+(remove?'':file));const r=spawnSync('curl',args,{input:upload,maxBuffer:2097152});if(r.status!==0){const e=new Error('FTPS operation failed with exit '+r.status);e.code=r.status;throw e;}return r.stdout;}
          function literal(t,n){const m=t.match(new RegExp('^\\s*\\$CFG->'+n+'\\s*=\\s*([\'\"])((?:\\\\.|[^\'\"\\\\\\r\\n])*)\\1\\s*;','m'));if(!m)throw new Error('Unsupported configuration format for '+n);if(m[1]==="'")return m[2].replace(/\\(['\\])/g,'$1');if(/\$/.test(m[2]))throw new Error('Unsupported configuration interpolation');return m[2].replace(/\\([\\"nrt])/g,(_,c)=>({n:'\n',r:'\r',t:'\t'}[c]||c));}
          function config(ip){const t=ftp(ip,'moodle/config.php').toString('utf8');return {database:literal(t,'dbname'),username:literal(t,'dbuser'),password:literal(t,'dbpass'),prefix:literal(t,'prefix')};}
          function request(s,payload){const r=spawnSync('curl',['--http1.1','--fail','--silent','--show-error','--connect-timeout','15','--max-time','900','--resolve','agsedu.org:443:129.121.157.187','--header','Content-Type: application/json','--header','X-AGS-Recovery-Token: '+s.token,'--data-binary','@-','https://agsedu.org/'+s.file],{input:JSON.stringify(payload),maxBuffer:1048576});if(r.status!==0)throw new Error('Protected restore request failed with exit '+r.status);let p;try{p=JSON.parse(r.stdout.toString());}catch{throw new Error('Restore returned a non-JSON response');}if(!p.ok)throw new Error('Restore failed: '+JSON.stringify(p));return p;}
          function getPage(url,file){const args=['--http1.1','--fail','--silent','--show-error','--compressed','--location','--max-redirs','5','--connect-timeout','10','--max-time','45','--output',file,'--write-out','%{http_code}|%{remote_ip}|%{url_effective}'];for(const host of ['agsedu.org','www.agsedu.org','lms.agsedu.org'])args.push('--resolve',host+':443:129.121.157.187');const r=spawnSync('curl',args.concat(url),{maxBuffer:1048576});const body=fs.existsSync(file)?fs.readFileSync(file,'utf8'):'';return {ok:r.status===0&&r.stdout.toString().startsWith('200|')&&/<title>[^<]*Elizabeth/i.test(body),url,result:r.stdout.toString(),title:body.match(/<title>(.*?)<\/title>/s)?.[1]||null};}
          async function restore(){
           fs.mkdirSync(dir,{recursive:true,mode:0o700});const s={id:'20261022-'+crypto.randomBytes(8).toString('hex'),token:crypto.randomBytes(32).toString('hex'),installed:[],mayHaveApplied:false};s.file='ags-elizabeth-'+s.id+'.php';const save=()=>fs.writeFileSync(path.join(dir,'state.json'),JSON.stringify(s),{mode:0o600});save();
           const original=config('173.254.30.77');if(original.database!=='agsedug1_moodl'||original.prefix!=='mdl_')throw new Error('Unexpected original Moodle database');
           const template=fs.readFileSync(path.join(process.env.RUNNER_TEMP,'elizabeth-restore.php'),'utf8');
           for(const [role,ip] of [['old','173.254.30.77'],['new','129.121.157.187']]){const script=Buffer.from(template.replaceAll('__EXPIRES__',String(Math.floor(Date.now()/1000)+7200)).replaceAll('__TOKEN_HASH__',hash(s.token)).replaceAll('__ID__',s.id).replaceAll('__ROLE__',role));try{ftp(ip,s.file);throw new Error('Unexpected existing recovery endpoint');}catch(e){if(e.code!==78)throw e;}s.installed.push({ip,file:s.file});save();ftp(ip,s.file,script);if(hash(ftp(ip,s.file))!==hash(script))throw new Error('Recovery endpoint verification failed');}
           console.log(JSON.stringify({status:'Restoring from the backup already on the new server and synchronizing current original files directly between servers',recovery_id:s.id,backup_downloads:false}));
           const staged=request(s,{action:'stage',database:original,source_token:s.token});console.log(JSON.stringify({status:'Original Elizabeth files staged and verified',details:staged}));s.staged=staged;save();
           try{
            s.mayHaveApplied=true;save();const applied=request(s,{action:'apply',database:original});console.log(JSON.stringify({status:'Elizabeth activated on the new server',details:applied}));
            const phpFile='moodle/ags-elizabeth-check-'+s.id+'.php';const php=Buffer.from(`<?php if (!hash_equals('${hash(s.token)}', hash('sha256', $_SERVER['HTTP_X_AGS_RECOVERY_TOKEN'] ?? ''))) {http_response_code(404);exit;} header('Content-Type: text/plain'); echo PHP_VERSION;`);s.installed.push({ip:'129.121.157.187',file:phpFile});save();ftp('129.121.157.187',phpFile,php);
            const pr=spawnSync('curl',['--http1.1','--fail','--silent','--show-error','--max-time','30','--resolve','lms.agsedu.org:443:129.121.157.187','--header','X-AGS-Recovery-Token: '+s.token,'https://lms.agsedu.org/'+phpFile.slice(7)],{maxBuffer:1048576});if(pr.status!==0||!/^8\.3\./.test(pr.stdout.toString()))throw new Error('Restored PHP runtime verification failed');console.log(JSON.stringify({php_version:pr.stdout.toString()}));
            const urls=['https://lms.agsedu.org/','https://lms.agsedu.org/login/index.php','https://agsedu.org/moodle','https://agsedu.org/moodle/login/index.php'];const checks=[];
            for(let i=0;i<urls.length;i++){let r;for(let attempt=0;attempt<3;attempt++){r=getPage(urls[i],path.join(dir,'check-'+i+'.html'));if(r.ok)break;await new Promise(resolve=>setTimeout(resolve,3000));}checks.push(r);console.log(JSON.stringify({page_check:r}));if(!r.ok)throw new Error('Restored Moodle page verification failed');}
            const verified=request(s,{action:'verify',database:original});if(verified.database.files_checked!==verified.database.files_present||verified.database.site.shortname!=='Elizabeth')throw new Error('Final database and file verification failed');console.log(JSON.stringify({status:'ELIZABETH_RESTORED_AND_VERIFIED',details:verified,recovery_id:s.id}));s.complete=true;s.final=verified;save();
           }catch(e){console.error(e.message);if(s.mayHaveApplied){try{console.log(JSON.stringify({rollback:request(s,{action:'rollback'})}));}catch(rollbackError){console.error('Rollback needs inspection: '+rollbackError.message);}}throw e;}
          }
          function cleanup(){if(!fs.existsSync(path.join(dir,'state.json')))return;const s=JSON.parse(fs.readFileSync(path.join(dir,'state.json')));let failed=false;for(const item of s.installed){try{ftp(item.ip,item.file,undefined,true);try{ftp(item.ip,item.file);throw new Error('Temporary recovery endpoint remains');}catch(e){if(e.code!==78)throw e;}console.log(JSON.stringify({server_ip:item.ip,temporary_endpoint_removed:item.file}));}catch(e){console.error(JSON.stringify({cleanup_failed:item.file,server_ip:item.ip,error:e.message}));failed=true;}}if(failed)throw new Error('Recovery cleanup requires attention');}
          (async()=>{try{if(process.argv[2]==='restore')await restore();else if(process.argv[2]==='cleanup')cleanup();else throw new Error('Unknown mode');}catch(e){console.error(e.message);process.exitCode=1;}})();
          JS
          php -l "$RUNNER_TEMP/elizabeth-restore.php"
          node "$RUNNER_TEMP/elizabeth-restore.cjs" restore
      - name: Remove temporary protected recovery endpoints
        if: always()
        run: node "$RUNNER_TEMP/elizabeth-restore.cjs" cleanup
