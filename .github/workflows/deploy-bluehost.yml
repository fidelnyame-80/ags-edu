name: Verify original Moodle records and uploaded files
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FTP_USER: ${{ secrets.BLUEHOST_FTP_USERNAME }}
      FTP_PASS: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
    steps:
      - name: Read Moodle record counts using a temporary protected diagnostic and remove it
        run: |
          cat > "$RUNNER_TEMP/moodle-db-probe.php" <<'PHP'
          <?php
          ini_set('display_errors', '0');
          header('Cache-Control: no-store');
          if ($_SERVER['REQUEST_METHOD'] !== 'POST' || time() > __EXPIRES__ ||
              !hash_equals('__TOKEN_HASH__', hash('sha256', $_SERVER['HTTP_X_AGS_RECOVERY_TOKEN'] ?? ''))) {
              http_response_code(404); exit;
          }
          header('Content-Type: application/json');
          $stage = 'request';
          try {
              $p = json_decode(file_get_contents('php://input'), true, 8, JSON_THROW_ON_ERROR);
              if (!in_array($p['database'] ?? '', ['agsedug1_moodl', 'agsedug1_mood772'], true) ||
                  !in_array($p['prefix'] ?? '', ['mdl_', 'mdlh6_'], true)) {
                  http_response_code(400); exit;
              }
              $stage = 'database_connection';
              mysqli_report(MYSQLI_REPORT_ERROR | MYSQLI_REPORT_STRICT);
              $db = new mysqli('localhost', $p['username'], $p['password'], $p['database']);
              $db->set_charset('utf8mb4');
              $db->query('START TRANSACTION READ ONLY');
              $stage = 'read_metadata';
              $prefix = $p['prefix'];
              $site = $db->query("SELECT fullname, shortname FROM {$prefix}course WHERE id=1")->fetch_assoc();
              $courses = $db->query("SELECT COUNT(*) AS n FROM {$prefix}course WHERE id<>1")->fetch_assoc()['n'];
              $users = $db->query("SELECT COUNT(*) AS n FROM {$prefix}user WHERE deleted=0 AND username<>'guest'")->fetch_assoc()['n'];
              $enrolments = $db->query("SELECT COUNT(*) AS n FROM {$prefix}user_enrolments")->fetch_assoc()['n'];
              $settings = [];
              $rows = $db->query("SELECT name,value FROM {$prefix}config WHERE name IN ('version','release','theme')");
              while ($row = $rows->fetch_assoc()) $settings[$row['name']] = $row['value'];
              $filedir = '/home1/agsedug1/moodledata/filedir';
              $files = $db->query("SELECT COUNT(*) AS n, SUM(filesize) AS bytes FROM {$prefix}files WHERE filename<>'.'")->fetch_assoc();
              $samples = $db->query("SELECT DISTINCT contenthash FROM {$prefix}files WHERE filename<>'.' AND filesize>0 ORDER BY contenthash LIMIT 20");
              $checked=0; $present=0;
              while ($row = $samples->fetch_assoc()) {
                  $hash = $row['contenthash'];
                  if (!preg_match('/^[0-9a-f]{40}$/', $hash)) continue;
                  $checked++;
                  if (is_readable($filedir.'/'.substr($hash,0,2).'/'.substr($hash,2,2).'/'.$hash)) $present++;
              }
              $db->rollback();
              echo json_encode(['ok'=>true, 'site'=>$site, 'courses'=>(int)$courses, 'active_accounts'=>(int)$users,
                  'enrolments'=>(int)$enrolments, 'settings'=>$settings, 'file_records'=>(int)$files['n'],
                  'referenced_file_bytes'=>(int)$files['bytes'], 'file_directory_readable'=>is_readable($filedir),
                  'sample_files_checked'=>$checked, 'sample_files_present'=>$present]);
          } catch (Throwable $e) {
              echo json_encode(['ok'=>false,'stage'=>$stage,'error_code'=>(int)$e->getCode()]);
          }
          PHP
          cat > "$RUNNER_TEMP/moodle-db-probe.cjs" <<'JS'
          const fs=require('fs'),crypto=require('crypto'),{spawnSync}=require('child_process');
          const hash=b=>crypto.createHash('sha256').update(b).digest('hex');
          function ftp(ip,file,upload,remove=false){
           const host=ip==='173.254.30.77'?'ftp.justhost.com':'ftp.bluehost.com';
           const args=['--fail','--silent','--show-error','--connect-timeout','10','--max-time','45','--ssl-reqd','--resolve',`${host}:21:${ip}`,'--user',process.env.FTP_USER+':'+process.env.FTP_PASS];
           if(upload)args.push('--upload-file','-');
           if(remove)args.push('--quote','DELE '+file,'--list-only');
           args.push('ftp://'+host+'/'+(remove?'':file));
           const r=spawnSync('curl',args,{input:upload,maxBuffer:2097152});
           if(r.status!==0){const e=new Error(`FTPS operation failed with exit ${r.status}`);e.code=r.status;throw e;}
           return r.stdout;
          }
          function literal(text,name){
           const re=new RegExp('^\\s*\\$CFG->'+name+'\\s*=\\s*([\'\"])((?:\\\\.|[^\'\"\\\\\\r\\n])*)\\1\\s*;','m');
           const m=text.match(re);if(!m)throw new Error('Unsupported configuration field format: '+name);
           if(m[1]==='\'')return m[2].replace(/\\(['\\])/g,'$1');
           if(/\$/.test(m[2]))throw new Error('Unsupported interpolated configuration field: '+name);
           return m[2].replace(/\\([\\"nrt])/g,(_,c)=>({n:'\n',r:'\r',t:'\t'}[c]||c));
          }
          function cfg(ip){const c=ftp(ip,'moodle/config.php').toString('utf8');return {database:literal(c,'dbname'),username:literal(c,'dbuser'),password:literal(c,'dbpass'),prefix:literal(c,'prefix')};}
          const installed=[];
          try{
           const configs={old:cfg('173.254.30.77'),new:cfg('129.121.157.187')};
           const template=fs.readFileSync(process.env.RUNNER_TEMP+'/moodle-db-probe.php','utf8');
           const token=crypto.randomBytes(32).toString('hex'),file='moodle/ags-recovery-'+crypto.randomBytes(16).toString('hex')+'.php';
           const probe=Buffer.from(template.replace('__EXPIRES__',String(Math.floor(Date.now()/1000)+900)).replace('__TOKEN_HASH__',hash(token)));
           for(const [label,ip] of [['old','173.254.30.77'],['new','129.121.157.187']]){
            try{
             try{ftp(ip,file);throw new Error('Probe filename unexpectedly exists');}catch(e){if(e.code!==78)throw e;}
             installed.push({ip,file});
             ftp(ip,file,probe);
             if(hash(ftp(ip,file))!==hash(probe))throw new Error('Probe upload verification failed');
             console.log(JSON.stringify({server:label,temporary_diagnostic:file}));
             for(const source of label==='old'?['old']:['new','old']){
              const r=spawnSync('curl',['--fail','--silent','--show-error','--connect-timeout','10','--max-time','40','--resolve',`lms.agsedu.org:443:${ip}`,'--header','Content-Type: application/json','--header','X-AGS-Recovery-Token: '+token,'--data-binary','@-','https://lms.agsedu.org/'+file.slice('moodle/'.length)],{input:JSON.stringify(configs[source]),maxBuffer:1048576});
              if(r.status!==0){console.log(JSON.stringify({server:label,database:configs[source].database,error:'HTTPS diagnostic failed',curl_exit:r.status}));continue;}
              let result;try{result=JSON.parse(r.stdout.toString('utf8'));}catch{result={error:'Non-JSON diagnostic response',bytes:r.stdout.length};}
              console.log(JSON.stringify({server:label,database:configs[source].database,result}));
             }
            }catch(e){console.log(JSON.stringify({server:label,error:e.message}));}
           }
          }catch(e){console.error(e.message);process.exitCode=1;}
          finally{
           for(const item of installed){
            try{ftp(item.ip,item.file,undefined,true);try{ftp(item.ip,item.file);throw new Error('Diagnostic remains present');}catch(e){if(e.code!==78)throw e;}console.log(JSON.stringify({server_ip:item.ip,temporary_diagnostic_removed:true}));}
            catch(e){console.error(JSON.stringify({server_ip:item.ip,cleanup_failed:item.file,error:e.message}));process.exitCode=1;}
           }
          }
          JS
          php -l "$RUNNER_TEMP/moodle-db-probe.php"
          node "$RUNNER_TEMP/moodle-db-probe.cjs"
