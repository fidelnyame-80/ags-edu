name: Deploy to Bluehost

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build website
        run: |
          npm ci
          npm run build

      - name: Publish build to Bluehost
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.BLUEHOST_FTP_SERVER }}
          username: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          password: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          # deploy@agsedu.org is already rooted at /home1/agsedug1/public_html.
          server-dir: ./
          # Recovery preview only: verify backups and review the planned changes
          # before disabling dry-run for the first deployment to the correct root.
          dry-run: true
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            documents/**
            public_html/**
            wp-admin/**
            wp-content/**
            wp-includes/**
            wp-*.php
            index.php
            api/contact-config.php
            .htaccess.wordpress-backup
          log-level: standard
