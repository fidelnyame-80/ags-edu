name: AGS server migration recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Back up the new server homepage and routing configuration
        env:
          FTP_USER: ${{ secrets.BLUEHOST_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.BLUEHOST_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ags-recovery-backup"
          for file in index.html .htaccess; do
            curl --fail --silent --show-error --connect-timeout 15 --max-time 90 \
              --ssl-reqd --resolve ftp.bluehost.com:21:129.121.157.187 \
              --user "$FTP_USER:$FTP_PASS" \
              "ftp://ftp.bluehost.com/$file" \
              --output "$RUNNER_TEMP/ags-recovery-backup/$file"
          done
          python - <<'PY'
          import os, pathlib, hashlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ags-recovery-backup'
          for name in ('index.html', '.htaccess'):
              data = (root / name).read_bytes()
              print(f'{name}: {len(data)} bytes, sha256={hashlib.sha256(data).hexdigest()}')
              print(data.decode('utf-8', errors='replace'))
          PY
      - name: Save recovery backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ags-server-before-homepage-recovery
          path: ${{ runner.temp }}/ags-recovery-backup/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
