<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spider News 2026–2027</title>
<meta name="description" content="Spider News 2026–2027 Edition — the digital flipbook newsletter of Accra Grammar School.">
<style>
:root{--red:#A8122E;--red-dk:#5E0716;--gold:#F2B705;--ink:#1a1718}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh}
.bar{padding-top:max(10px,env(safe-area-inset-top))!important}
.foot{padding-bottom:max(10px,env(safe-area-inset-bottom))!important}
@media(max-width:380px){.bar{gap:4px;padding-left:6px;padding-right:6px}.bar .title b{font-size:12px}.bar .title img{width:24px;height:24px}.tb{padding:8px!important}.foot{gap:6px;padding-left:6px;padding-right:6px}.foot .pg{min-width:0;font-size:12px}}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(ellipse at center,#7d0d22 0%,#3a0410 70%,#22020a 100%);color:#fff;overflow:hidden;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* toolbar */
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08);z-index:5}
.bar .title{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.bar .title img{width:38px;height:38px;border-radius:50%;background:#fff}
.bar .title>div{min-width:0}
.bar .title b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:480px){.bar .title b{font-size:14px}.bar .title img{width:32px;height:32px}.hint{display:none}}
.bar .title span{display:block;font-size:12px;opacity:.75;white-space:nowrap}
.tb{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;background:rgba(255,255,255,.08);font-size:14px;font-weight:600;white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.18)}
.tb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb.gold{background:var(--gold);color:var(--ink)}
@media(max-width:720px){.tb .lbl{display:none}.bar .title span{display:none}.tb{padding:8px 10px}}

/* stage */
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:18px 70px;min-height:0}
@media(max-width:720px){.stage{padding:10px 8px}}
#book{margin:0 auto}
.page{background:#fff;overflow:hidden}
.page img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.page.--left{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
.page.--right{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;z-index:4}
.arrow:hover{background:var(--gold);color:var(--ink)}
.arrow svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.arrow.prev{left:12px}.arrow.next{right:12px}
@media(max-width:720px){.arrow{display:none}}

/* bottom bar */
.foot{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px;background:rgba(0,0,0,.35);border-top:1px solid rgba(255,255,255,.08);font-size:14px}
.foot .pg{font-weight:700;min-width:170px;text-align:center}
.foot input[type=range]{width:min(420px,45vw);accent-color:var(--gold)}
.foot .mb{display:none}
@media(max-width:720px){.foot input[type=range]{display:none}.foot .mb{display:inline-flex}}

/* panels */
.panel{position:fixed;top:0;bottom:0;left:0;width:min(360px,90vw);background:#1b1617;z-index:20;transform:translateX(-102%);transition:transform .3s ease;display:flex;flex-direction:column;box-shadow:10px 0 40px rgba(0,0,0,.5)}
.panel.open{transform:none}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--red)}
.panel header b{font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.panel .body{overflow-y:auto;padding:10px}
.toc a{display:flex;justify-content:space-between;gap:12px;padding:11px 12px;border-radius:8px;color:#fff;text-decoration:none;font-size:15px;border-bottom:1px solid rgba(255,255,255,.06)}
.toc a:hover,.toc a.cur{background:rgba(242,183,5,.15)}
.toc a span:last-child{color:var(--gold);font-weight:700;white-space:nowrap}
.toc .grp{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:14px 12px 4px;opacity:.85}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.thumbs button{text-align:center;font-size:12px;opacity:.85}
.thumbs button:hover,.thumbs button.cur{opacity:1}
.thumbs img{width:100%;aspect-ratio:1/1.414;object-fit:cover;border-radius:4px;border:3px solid transparent;margin-bottom:4px;background:#333}
.thumbs button.cur img{border-color:var(--gold)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;display:none}
.scrim.show{display:block}

/* zoom */
.zoom{position:fixed;inset:0;background:#120e0f;z-index:30;display:none;flex-direction:column}
.zoom.show{display:flex}
.zoom .zbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--red)}
.zoom .zbar{flex-wrap:wrap;gap:8px}
.zoom .zbody{flex:1;min-height:0;overflow:auto;padding:16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.zpages{display:flex;gap:10px;margin:0 auto;align-items:flex-start}
.zoom .zpages img{display:block;width:100%;height:auto;min-width:0;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.zoom .zpages.two img{width:calc(50% - 5px)}
.zcontrols{display:flex;align-items:center;gap:8px}
.zcontrols button{min-width:44px;min-height:44px;border-radius:8px;background:rgba(255,255,255,.15);font-weight:700}
.zcontrols output{min-width:48px;text-align:center}
#btnZoom .lbl{display:inline}
@media(max-width:900px){.zpages{flex-direction:column}.zoom .zpages.two img{width:100%}}
.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:7px 14px;border-radius:20px;font-size:13px;pointer-events:none;transition:opacity .6s}
@media(max-width:380px){.foot{gap:6px;padding-left:6px;padding-right:6px}.foot .pg{min-width:0;flex:1;font-size:12px}}
</style>
</head>

<script>
(function(){
  var N=42;
  function label(i){ if(i===0) return 'Front Cover'; if(i===N-1) return 'Back Cover · Academic Calendar'; return 'Page '+i; }
  function short(i){ if(i===0) return 'Cover'; if(i===N-1) return 'Back'; return String(i); }
  var TOC=[
    ['grp','Front'],
    ['Front Cover',0],
    ['grp','Inside Story'],
    ['Welcome Message from Principal',1],
    ['New Staff Appointments',2],
    ['A New Chapter in Academic Leadership: Ms. Sandra Okyeadie Mensah',3],
    ['Our Newest Members of Staff',5],
    ['Enhancing AGS LMS (Elizabeth)',6],
    ['Janet Catherine Rickert Children\'s Library',7],
    ['AGS Sports Field Upgrade: AstroTurf',9],
    ['AGS Saturday Music School',10],
    ['Alumni News: Celestine Esinam Vormawor Esq.',11],
    ['Alumni Spotlight: Miss Stella Wilson',13],
    ['Alumni Spotlight: Brian Issaka',14],
    ['Students\' Corner &amp; Prefectorial Board',15],
    ['Short Story: The Wallet Under the Mango Tree',18],
    ['Riddle Time, Brain Teaser &amp; Word Scramble',19],
    ['Who Am I?, Did You Know? &amp; AGS Quick Quiz',20],
    ['grp','Departmental Updates'],
    ['Preschool Department',21],
    ['Primary Department',22],
    ['JHS Department',24],
    ['Counselling Unit',25],
    ['Message from the Board of Directors',27],
    ['Acquisition of Two New School Buses',28],
    ['Logistics, Stores &amp; Transport Department',29],
    ['Finance Office',30],
    ['Infrastructure Development &amp; Facility Improvements',32],
    ['Future Development: The International Baccalaureate (IB)',34],
    ['Remembering Professor Yaw Ahenkorah (1933–2026)',35],
    ['Photo Gallery: Visa Day &amp; Inter-House Sports',38],
    ['grp','Back'],
    ['Academic Calendar 2026/2027',41]
  ];

  var bookEl=document.getElementById('book'), stage=document.getElementById('stage'), R=1.414;
  function fit(){
    var cs=getComputedStyle(stage), aw=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),
        ah=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    var two=aw>ah*0.9, ph=ah, pw=ph/R;
    if((two?2:1)*pw>aw){ pw=aw/(two?2:1); ph=pw*R; }
    bookEl.style.width=Math.floor((two?2:1)*pw)+'px';
    return {w:Math.floor(pw),h:Math.floor(ph)};
  }
  var sz=fit();
  var pf=new St.PageFlip(bookEl,{
    width:sz.w,height:sz.h,size:'stretch',
    minWidth:Math.min(200,sz.w),maxWidth:sz.w,minHeight:Math.min(200*R,sz.h),maxHeight:sz.h,
    showCover:true,usePortrait:true,mobileScrollSupport:false,
    maxShadowOpacity:.45,flippingTime:800,drawShadow:true,autoSize:true
  });
  pf.loadFromHTML(document.querySelectorAll('#book .page'));

  var pg=document.getElementById('pg'), slider=document.getElementById('slider');
  function visible(){
    var i=pf.getCurrentPageIndex();
    if(pf.getOrientation()==='portrait' || i===0 || i===N-1) return [i];
    if(i%2===0) i=i-1;               // spreads are (1,2),(3,4)...
    return [i,i+1].filter(function(x){return x<N-1||x===N-1});
  }
  // Load the current spread and nearby pages, keeping original image quality.
  var pageImages=document.querySelectorAll('#book .page img');
  function loadNearby(){
    var current=pf.getCurrentPageIndex();
    pageImages.forEach(function(img,i){
      if(Math.abs(i-current)<=3 && img.dataset.src) img.src=img.dataset.src;
    });
  }
  function update(){
    loadNearby();
    var v=visible(), t;
    if(v.length===1) t=label(v[0]);
    else t='Pages '+v[0]+' – '+v[1];
    pg.textContent=t+'  ·  '+(N-2)+' pages';
    slider.value=v[0];
    document.querySelectorAll('.thumbs button').forEach(function(b){b.classList.toggle('cur',v.indexOf(+b.dataset.i)>-1)});
    document.querySelectorAll('.toc a').forEach(function(a){a.classList.toggle('cur',v.indexOf(+a.dataset.i)>-1)});
    try{ history.replaceState(null,'','#page='+v[0]); }catch(e){}
  }
  pf.on('flip',update); pf.on('changeOrientation',update); pf.on('init',update);

  function go(i){ i=Math.max(0,Math.min(N-1,i)); pf.flip(i); closeAll(); }
  function goNow(i){ i=Math.max(0,Math.min(N-1,i)); pf.turnToPage(i); update(); closeAll(); }
  document.getElementById('prev').onclick=document.getElementById('prev2').onclick=function(){pf.flipPrev()};
  document.getElementById('next').onclick=document.getElementById('next2').onclick=function(){pf.flipNext()};
  document.getElementById('first').onclick=function(){goNow(0)};
  document.getElementById('last').onclick=function(){goNow(N-1)};
  slider.oninput=function(){ var v=visible(); pg.textContent=label(+slider.value); };
  slider.onchange=function(){ goNow(+slider.value) };
  document.addEventListener('keydown',function(e){
    if(document.getElementById('zoom').classList.contains('show')){
      if(e.key==='Escape') closeZoom();
      else if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();showZoomPage(zoomPage+1)}
      else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();showZoomPage(zoomPage-1)}
      return;
    }
    if(e.key==='ArrowRight'||e.key==='PageDown') pf.flipNext();
    else if(e.key==='ArrowLeft'||e.key==='PageUp') pf.flipPrev();
    else if(e.key==='Home') goNow(0); else if(e.key==='End') goNow(N-1);
    else if(e.key==='Escape') closeAll();
  });

  // contents
  var toc=document.getElementById('toc'), h='';
  TOC.forEach(function(t){
    if(t[0]==='grp') h+='<div class="grp">'+t[1]+'</div>';
    else h+='<a href="#page='+t[1]+'" data-i="'+t[1]+'"><span>'+t[0]+'</span><span>'+(t[1]===0?'Cover':t[1]===N-1?'Back':'p. '+t[1])+'</span></a>';
  });
  toc.innerHTML=h;
  toc.addEventListener('click',function(e){var a=e.target.closest('a'); if(!a) return; e.preventDefault(); go(+a.dataset.i);});

  // thumbnails
  var th='';
  for(var i=0;i<N;i++) th+='<button data-i="'+i+'"><img loading="lazy" src="pages/thumb-'+(i<10?'0':'')+i+'.jpg" alt="">'+label(i).replace(' · Academic Calendar','')+'</button>';
  var thumbs=document.getElementById('thumbs'); thumbs.innerHTML=th;
  thumbs.addEventListener('click',function(e){var b=e.target.closest('button'); if(b) goNow(+b.dataset.i);});

  // panels
  var scrim=document.getElementById('scrim');
  function open(id){ closeAll(); document.getElementById(id).classList.add('open'); scrim.classList.add('show'); }
  function closeAll(){ document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('open')}); scrim.classList.remove('show'); }
  document.getElementById('btnToc').onclick=function(){open('tocPanel')};
  document.getElementById('btnThumbs').onclick=function(){open('thumbPanel')};
  document.getElementById('closeToc').onclick=document.getElementById('closeThumbs').onclick=scrim.onclick=closeAll;

  // zoom
  var zoom=document.getElementById('zoom'), zbody=document.getElementById('zbody'), zpages=document.getElementById('zpages'), zoomScale=1, zoomPage=0;
  function setZoom(value, anchor){
    var old=zoomScale;
    zoomScale=Math.max(1,Math.min(4,value));
    var x=anchor ? anchor.x : zbody.clientWidth/2, y=anchor ? anchor.y : zbody.clientHeight/2;
    var left=(zbody.scrollLeft+x)*zoomScale/old-x, top=(zbody.scrollTop+y)*zoomScale/old-y;
    var base=Math.min(zbody.clientWidth-32,zpages.classList.contains('two') && innerWidth>900?1800:1100);
    zpages.style.width=Math.round(base*zoomScale)+'px';
    document.getElementById('zoomLevel').textContent=Math.round(zoomScale*100)+'%';
    document.getElementById('zoomOut').disabled=zoomScale<=1;
    document.getElementById('zoomIn').disabled=zoomScale>=4;
    zbody.scrollLeft=left; zbody.scrollTop=top;
  }
  document.getElementById('zoomIn').onclick=function(){setZoom(zoomScale+.5)};
  document.getElementById('zoomOut').onclick=function(){setZoom(zoomScale-.5)};
  document.getElementById('zoomReset').onclick=function(){setZoom(1);zbody.scrollLeft=0;zbody.scrollTop=0};
  var pinchStart=0, pinchScale=1;
  function distance(t){return Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY)}
  zbody.addEventListener('touchstart',function(e){if(e.touches.length===2){pinchStart=distance(e.touches);pinchScale=zoomScale;e.preventDefault()}},{passive:false});
  zbody.addEventListener('touchmove',function(e){if(e.touches.length===2 && pinchStart){e.preventDefault();var r=zbody.getBoundingClientRect();setZoom(pinchScale*distance(e.touches)/pinchStart,{x:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,y:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top})}},{passive:false});
  zbody.addEventListener('touchend',function(){pinchStart=0});
  window.addEventListener('resize',function(){if(zoom.classList.contains('show'))setZoom(zoomScale)});
  function src(i){ var img=pageImages[i]; return img.dataset.src||img.getAttribute('src'); }
  function showZoomPage(index){
    zoomPage=Math.max(0,Math.min(N-1,index));
    // A single enlarged page keeps mobile navigation and reading order clear.
    zpages.className='zpages';
    zpages.innerHTML='<img src="'+src(zoomPage)+'" alt="'+label(zoomPage)+'">';
    document.getElementById('ztitle').textContent=label(zoomPage);
    document.getElementById('zoomPrev').disabled=zoomPage===0;
    document.getElementById('zoomNext').disabled=zoomPage===N-1;
    pf.turnToPage(zoomPage); update();
    setZoom(zoomScale); zbody.scrollTop=0; zbody.scrollLeft=0;
  }
  document.getElementById('zoomPrev').onclick=function(){showZoomPage(zoomPage-1)};
  document.getElementById('zoomNext').onclick=function(){showZoomPage(zoomPage+1)};
  document.getElementById('btnZoom').onclick=function(){
    zoom.classList.add('show'); zoomScale=1; showZoomPage(pf.getCurrentPageIndex());
  };
  function closeZoom(){ zoom.classList.remove('show'); }
  document.getElementById('closeZoom').onclick=closeZoom;
  bookEl.addEventListener('dblclick',function(){document.getElementById('btnZoom').click()});

  // fullscreen
  document.getElementById('btnFull').onclick=function(){
    var action=document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    if(action && action.catch) action.catch(function(){});
  };

  // iPhone browsers without element fullscreen still support the full-page reader.
  if(!document.fullscreenEnabled) document.getElementById('btnFull').style.display='none';
  var rt; window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){
    var s=fit(), st=pf.getSettings(); st.minWidth=Math.min(200,s.w); st.minHeight=Math.min(200*R,s.h); st.maxWidth=s.w; st.maxHeight=s.h; st.width=s.w; st.height=s.h; pf.update(); update();
  },150)});
  // deep link #page=12
  var m=location.hash.match(/page=(\d+)/); if(m) setTimeout(function(){goNow(+m[1])},50);
  setTimeout(function(){var hn=document.getElementById('hint'); hn.style.opacity=0;},4500);
})();
</script>
</body>
